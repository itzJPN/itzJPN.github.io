<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>

  <script>
    // Map short names to destination URLs
    const redirects = {
      icopy: "https://jbluebird.github.io/iCopy",
      lg: "https://lailagrace.podbean.com",
      mp: "https://itzjpn.github.io",
      ioswebserver: "https://itzjpn.github.io/?rf=ioswebserver",
      x: "https://itzjpn.github.io/?rf=x",
      cloudedleopardupdatepage: "https://itzjpn.github.io/?rd=redirNotFound",
      cloudedleoparduserguide: "https://itzjpn.github.io/?rd=redirNotFound",
      ag: "https://sites.google.com/view/giveawaysacu/raffles",
      f1party-watch: "https://tv.apple.com/us/sporting-event/australia-race/umc.cse.zdi2cpjn1u5uhi5b9i2tc2dp?ctx_brand=tvs.sbd.4000",

      //BEGIN iMUSEUM WEBPAGES

      imuseumhomepage: "https://itzjpn.github.io/?rd=redirNotFound",
      imuseumabout: "https://itzjpn.github.io/?rd=redirNotFound"
      // add more here
    };

    // Read ?redir=...
    const params = new URLSearchParams(window.location.search);
    const key = params.get("redir");

    // Redirect if found, otherwise go to homepage
    if (key && redirects[key]) {
      window.location.replace(redirects[key]);
    } else {
      window.location.replace("https://itzjpn.github.io/?rf=redirNotFound");
    }
  </script>
</head>
<body>
</body>
</html>
