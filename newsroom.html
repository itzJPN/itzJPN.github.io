<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ItzJPN Newsroom</title>
  <style>
    :root {
      --primary: #007aff;
      --primary-dark: #005fc1;
      --bg: #fafafa;
      --text: #111;
      --muted: #555;
      --card-bg: #ffffff;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: linear-gradient(145deg, #f8f8f8, #ffffff);
      padding: 2rem 1rem;
      text-align: center;
      border-bottom: 1px solid #e0e0e0;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    header i {
      color: var(--muted);
    }

    .articles {
      max-width: 1000px;
      margin: 2rem auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      padding: 0 1rem;
    }

    .article {
      display: flex;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .article:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.15);
    }

    .article img {
      width: 200px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .article-content {
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
    }

    .article-content h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .article-content p {
      color: #444;
      flex-grow: 1;
      margin-bottom: 1rem;
    }

    .article-content a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .article-content a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      background: #f0f0f0;
      color: #777;
      font-size: 0.95rem;
      margin-top: 3rem;
    }

  </style>
</head>
<body>
  <header>
    <h1>ItzJPN Newsroom</h1>
    <i>Latest articles, updates, and experiments from ItzJPN.</i>
    <div id="google_translate_element"></div>
  </header>

  <section class="articles" id="articles-container">
    <!-- Articles will be inserted here via JS -->
  </section>

  <footer>
    &copy; Birdie Works '26. All rights reserved.
  </footer>

  <script>
    // Example JSON data for articles
    const articlesData = [
      {
        "title": "The release of DarkSword prompts new potential jailbreak for iOS 18",
        "image": "news/img/IMG_0664.jpeg",
        "description": "With the leak of the DarkSword exploit, it opened the road to new iOS 18 jailbreaks with kernel R/W. This is a very big exploit and it is currently being reported on from news sources, Google Security, iVerify and of course, here. Click Read More to dive in...",
        "link": "news/darksword.html"
      },
      {
        "title": "Gain access to an old Mac that you don't know the password to",
        "image": "news/img/IMG_0669.png",
        "description": "Have an old Mac that you REALLY need to access old data from it? If it's family pictures, or just plain important work documents, this quick guide has you covered. No password needed! Click Read More to dive in...",
        "link": "news/gain-access.html"
      }
    ];

    const container = document.getElementById('articles-container');

    articlesData.forEach(article => {
      const articleEl = document.createElement('div');
      articleEl.className = 'article';
      articleEl.innerHTML = `
        <img src="${article.image}" alt="${article.title}">
        <div class="article-content">
          <h2>${article.title}</h2>
          <p>${article.description}</p>
          <a href="${article.link}" ${article.link.startsWith('http') ? 'target="_blank"' : ''}>Read More</a>
        </div>
      `;
      container.appendChild(articleEl);
    });
  </script>
  <script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage: 'en'}, 'google_translate_element');
}
</script>

<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
