> **Disclaimer**
> Yeah, I’m no cybersecurity expert. Okay?! PLEASE don’t take any of my advice from this article! Thanks.

**Introduction to DarkSword**

DarkSword is an iOS 18 zero-click web exploit that was made by potentially Russian hackers. I know. Out of a spy movie. Well, not really! As Russia is ongoing a war with Ukraine, they seem to want to target Ukrainian iPhones. As the malware was investigated, it is found that it only launches the attack on IP addresses that come from Ukraine, and with the early code comments being in Russian, it’s clear that Russia is to blame for this malware.

However, it has been extracted from a suspicious website and leaked on GitHub, which I will not link here because a massive amount of devices are still running iOS 18. It’s can be very easy for a malicious actor to deploy it on their website.

This has also opened the road to new iOS jailbreaks for iOS 18, as this exploit provides kernel R/W access. This allowed jailbreaks such as Dopamine to upgrade it’s attack surface to later iOS versions.

**How to prevent your self from being attacked**

It’s a good common practice to:
- Always keep your iOS version updated
- If your phone does not support the latest iOS, try to save an buy a new iPhone.
- Avoid suspicious websites. Traits include using social engineering to get you to download an app onto your iPhone and having weird domain names

> **Note**
> The original attack only launches when it finds a phone with a Ukrainian IP address, however, because it has been leaked on GitHub, people can easily change and deploy their own versions of the exploit that target other countries too.

**So that’s all for today**
	
Hope you enjoyed the article. On the other hand, if you want to learn more, simply see other people’s articles on DarkSword and you’ll find a lot of knowledge my brain probably has never even thought of before.

Thanks for reading.
