> **Disclaimer**
> Please only proform this on devices you own. In no way should this guide be used by stolen devices. Thank you.

Ahhh yes. You look forward to recovering your old data, photos, music and more. You find your old Mac, power it on, then realize you forgot your password.

First, please check if your computer is compatible for this guide. If your computer is not compatible, it can lead to frustration for some users and a crashed Mac for others.

> **Works on**
> *MacOS X 10.0 Cheetah to macOS Mojave*
> 
> **Limited/Blocked**
> *macOS 10.15 Catalina, 11 Big Sur, 12 Monterey, 13 Ventura*
> - Split read-only system volume introduced in Catalina. The trick can still work if you carefully mount the writable data volume, but Apple tightened things up.
> - Still blocked if FileVault is on.
> 
> **Doesn’t Work On (in other words forget about it)**
> *macOS 10.15+ on Macs with a T2 security chip (2018 and later)*
> * T2 requires secure boot and FileVault integration. You can’t bypass user accounts with Single-User tricks.
> 
> *Apple Silicon Macs (M1, M2, M3…)*
> * No Single-User Mode. Apple replaced it with “RecoveryOS” (Command-R), which requires Apple ID or FileVault recovery key.
> 
> **How to check if you have FileVault**
> Run `fdesetup status` to see if you have FileVault enabled. If you do, this guide will not work for you. 

You click the reset password button— then remember you forgot your *master* password. Oopsie!

However, on older MacOS systems (like the OS X era) you can easily create a new administrator account and reset the password for the user from there.

You can easily do this by triggering and changing a var in the system, which will allow you to create your new admin temp account.

Let’s get started recovering your account! First, we need to boot into Single User Mode. Let’s get started on the guide! Just follow the steps below:

- **Boot into Single-User Mode**
  Restart your Mac and immediately hold **Command (⌘) + S**. 
  You’ll see a black screen with white text.
- **Mount the System Volume as Writable**
  Type the following and press Enter:
  ```bash
  /sbin/mount -uw /
  ```
- **Remove the master-password lock**
  This finally tells the setup assistant to run again
  ```bash
  rm /var/db/.AppleSetupDone
  ```
- **Reboot the Mac**
  ```bash
  reboot
  ```

Finally, this will start up the setup assistant upon reboot allowing you to create that new admin account to reset the password to your original account

> **Notice!**
> Your original keychain password is still set to your old account password. You cannot recover this password and reset it without your old password. If you want, you can create a new keychain. 
> 
> Please note that this new keychain will not have your old passwords and is completely new. Look into backing up your old keychain for safekeeping it safely in a harddrive as you guess your old password. 
	- ItzJPN
