**Image Source:** Microsoft

The thing that stops me from either buying a PC or even using Windows on an old Mac is that Microsoft has been filling Windows 11 to the brim with AI features and Copilot. This choice has experienced severe internet backlash and has lead to a change in the company that will hopefully lead to a better Windows. Is it actually what Microsoft says it’s going to be?

**The Issue**
Microsoft began adding Copilot (formerly Bing Chat) to its apps and services in early 2023, with a rapid expansion across the Microsoft 365 ecosystem throughout late 2023 and 2024. 

- Early 2023: Introduced as "Bing Chat" and "Dynamics 365 Copilot" in February and March respectively.
- Late 2023 (Sept/Nov): Rebranded all chatbot variants (Windows Copilot, Bing Chat, M365 Copilot) to "Microsoft Copilot".
- 2024/2025: Integrated into more apps, including Paint, Photos, and Clipchamp in Windows 11, with plans to make the dedicated app a default installation by October 2025.
- October 2025: The copilot app is added preinstalled to Windows 11 systems
- Jan 15, 2025: The "Microsoft 365" app began rebranding to "Microsoft 365 Copilot" to unify the experience

**The Backlash**

- Early/Late 2023: When everything became “Copilot” in late 2023, people got frustrated because too many products had the same name (Windows, Bing, Office, etc.), It wasn’t clear what each version actually *did*, so users joked it was impossible to tell them apart
- 2024/2025: Users didn’t want AI in basic apps like Paint, it felt unnecessary and intrusive. Also, on the other hand, Windows users complained big time that that extra unnecessary integration has made their systems heavier. Most users could not find ways to uninstall it, which lead to the classic “Let Me Choose” backlash.
- October 2025: Users dislike preinstalled tools they didn’t ask for. By this point, many users were tired of AI being everywhere. “Not everything needs AI” became a common sentiment. Always-available AI made users suspicious about data collection, especially tied to OS-level access.
- Jan 15, 2025: Microsoft 365 was getting more expensive from forced added AI features, which lead to some users saying they were feeling like they were being upsold. Also, people asked: “Is this actually new or just renamed?” leading to some smaller confusion. In the workplace setting, employees didn’t always want AI in their workflow. There were big concerns about accuracy in documents, emails, and spreadsheets.

**Micro*slop*’s solution**

Silently cut down AI in Windows 11 due to the Microslop criticism on platforms like Reddit, X (formerly Twitter). Microsoft’s solution can be summed up as:

- Reduce friction
  - Less forced AI
  - Less clutter
- Increase control
  - Toggles
  - Admin settings
- Limit scope
  - Not every app needs AI
  - Not always running

I’m still waiting to see how the internet feels on this subject, but at least it’s something Microsoft is paying attention to. Well, they kinda have to, right? Like why lose 50B dollars on AI & Copilot when you can *attempt* to draw it back and *attempt* to make users actually happy. 

I say attempt strongly.

**So that’s all for now**
